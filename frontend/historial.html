<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial — TriajeVN</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/trazas-tree.css">
  <link rel="stylesheet" href="css/documentacion.css">
</head>
<body>
<div class="app-container">
  <header class="app-header">
    <div class="header-inner">
      <span class="header-badge">Historial</span>
      <h1><span>Incidencias</span> Registradas</h1>
      <div class="header-meta"><b><div id="hdrTotal">– registros</div></b><div>SQLite</div></div>
    </div>
  </header>

  <div class="nav-bar">
    <a href="index.html" class="button-back">Inicio</a>
    <div class="nav-actions">
      <a id="btnExportCSV" href="#" class="btn-export-link">🡇 &nbsp;Exportar CSV</a>
    </div>
  </div>

  <div class="hist-box">
    <div class="hist-toolbar">
      <input type="text" id="searchInput" placeholder="Buscar por ID o descripción…" style="flex:1;min-width:0;margin-bottom:0">
      <select id="filterDepto" class="button-like-select" style="min-width:0;width:auto;height:40px">
        <option value="">Todos los departamentos</option>
        <option value="Hub Activo">Hub Activo</option>
        <option value="Particulares">Particulares</option>
        <option value="Automatizacion">Automatizacion</option>
        <option value="Documentos">Documentos</option>
        <option value="Precios">Precios</option>
        <option value="Negocio">Negocio</option>
        <option value="CAU">CAU</option>
      </select>
    </div>
    <div style="overflow-x:auto">
      <table class="hist-table">
        <thead>
          <tr>
            <th>ID</th><th>Descripción</th><th>Asignado</th>
            <th>Error</th><th>Fecha</th><th>Trazas</th><th>Documentación</th><th></th>
          </tr>
        </thead>
        <tbody id="tableBody"><tr><td colspan="8" class="tbl-empty">Cargando…</td></tr></tbody>
      </table>
    </div>
    <div class="hist-pagination">
      <span id="paginInfo" style="flex:1;font-size:12px;color:var(--text-muted);font-family:var(--font-mono)"></span>
      <button class="btn-page" id="btnPrev">← Anterior</button>
      <button class="btn-page" id="btnNext">Siguiente →</button>
    </div>
  </div>
</div>

<!-- MODAL TRAZAS XML -->
<div class="trazas-overlay hidden" id="trazasOverlay">
  <div class="trazas-modal">
    <div class="trazas-modal-header">
      <span>Visor de trazas</span>
      <span class="trazas-modal-id" id="trazasModalId"></span>
      <button class="btn-modal-close" id="btnTrazasClose">✕</button>
    </div>
    <div class="trazas-view-tabs">
      <button class="trazas-tab active" id="tabVisual" onclick="switchTab('visual')">🗂️ Visual</button>
      <button class="trazas-tab" id="tabPlano" onclick="switchTab('plano')">📄 Texto plano</button>
      <div class="trazas-tab-actions">
        <!-- Solo visible en tab Visual -->
        <button class="trazas-action-btn" id="btnExpandAll"   title="Expandir todo">➕</button>
        <button class="trazas-action-btn" id="btnCollapseAll" title="Colapsar todo">➖</button>
        <!-- Solo visible en tab Plano -->
        <button class="trazas-action-btn hidden" id="btnCopyPlano" title="Copiar al portapapeles">📋 Copiar</button>
      </div>
    </div>
    <div class="trazas-search-bar hidden" id="trazasSearchBar">
      <div class="trazas-search-inner">
        <span class="trazas-search-icon">🔍</span>
        <input
          type="text"
          id="trazasSearchInput"
          class="trazas-search-input"
          placeholder="Buscar campo o valor…"
          autocomplete="off"
          spellcheck="false"
        />
        <span class="trazas-search-count" id="trazasSearchCount"></span>
        <button class="trazas-search-clear hidden" id="trazasSearchClear" title="Limpiar búsqueda">🧹</button>
      </div>
    </div>
    <div class="trazas-body" id="trazasBody">
      <div class="trazas-loading"><span class="dots">Cargando trazas...</span></div>
    </div>
  </div>
</div>



<!-- MODAL DOCUMENTACIÓN -->
<div id="docOverlay" class="hidden">
  <div class="doc-modal">
    <div class="doc-modal-header">
      <span>Documentación relacionada</span>
      <span class="doc-modal-id" id="docModalId"></span>
      <button class="btn-modal-close" id="btnDocClose">✕</button>
    </div>
    <div id="docBody">
      <div class="doc-estado">Buscando documentación…</div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/documentacion.js"></script>
<script src="js/trazas.js"></script>
<script src="js/historial.js"></script>
</body>
</html>
